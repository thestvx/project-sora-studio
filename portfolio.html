<!doctype html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SORA STUDIO — Portfolio Gallery</title>

    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@900&family=Noto+Sans+Arabic:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root { --brand: #161B91; }
        body { font-family: 'Inter', 'Noto Sans Arabic', sans-serif; background: #ffffff; overflow-x: hidden; scroll-behavior: smooth; }
        .hero-title { color: var(--brand); line-height: 1.2; }
        
        /* --- تأثير اللوجو --- */
        .logo-text { max-width: 0; opacity: 0; overflow: hidden; white-space: nowrap; transition: max-width 0.7s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.5s ease; display: inline-block; vertical-align: middle; }
        .logo-group:hover .logo-text { max-width: 250px; opacity: 1; margin-left: 12px; }
        .logo-img { transition: transform 0.8s cubic-bezier(0.34, 1.56, 0.64, 1); }
        .logo-group:hover .logo-img { transform: rotate(360deg); }

        .filter-btn { transition: all 0.3s ease; color: #6b7280; border: 1.5px solid #f3f4f6; font-size: 11px; font-weight: 700; background: white; padding: 10px 24px; border-radius: 100px; cursor: pointer; }
        .filter-btn.active { background: var(--brand); color: white; border-color: var(--brand); }

        .work-item { transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.5s ease; will-change: transform, opacity; }
        .work-item.hidden { display: none !important; opacity: 0; transform: translateY(20px) scale(0.98); }

        .work-item.short-item { grid-column: span 1; } 
        .work-item.video-item { grid-column: span 2; } 

        .work-card { position: relative; border-radius: 1.2rem; overflow: hidden; background: #f3f4f6; cursor: pointer; height: 100%; }
        .img-wrapper { width: 100%; position: relative; aspect-ratio: 3/4; overflow: hidden; }
        .video-wrapper { aspect-ratio: 16/9 !important; }
        .short-wrapper { aspect-ratio: 9/16 !important; }

        .work-card img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.5s ease; }
        .card-info { position: absolute; inset: 0; background: linear-gradient(to top, rgba(22, 27, 145, 0.7), transparent); display: flex; flex-direction: column; justify-content: flex-end; padding: 15px; opacity: 0; transition: opacity 0.3s ease; }
        .work-card:hover img { transform: scale(1.05); }
        .work-card:hover .card-info { opacity: 1; }

        .play-icon { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 60px; height: 60px; background: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--brand); font-size: 1.5rem; z-index: 10; box-shadow: 0 10px 20px rgba(0,0,0,0.2); }

        /* --- Modal Video --- */
        #video-modal { position: fixed; inset: 0; z-index: 2000; background: rgba(10, 12, 50, 0.95); backdrop-filter: blur(15px); display: none; align-items: center; justify-content: center; padding: 20px; }
        #video-modal.active { display: flex; }
        .modal-container { width: 100%; max-width: 1000px; position: relative; background: white; padding: 10px; border-radius: 2rem; }
        .iframe-wrapper { width: 100%; aspect-ratio: 16/9; border-radius: 1.5rem; overflow: hidden; background: black; }
        .modal-container.short-modal { max-width: 400px; }
        .modal-container.short-modal .iframe-wrapper { aspect-ratio: 9/16; }
        .close-video { position: absolute; top: -50px; right: 0; color: white; font-size: 1.8rem; cursor: pointer; width: 45px; height: 45px; background: rgba(255,255,255,0.1); border-radius: 50%; display: flex; align-items: center; justify-content: center; transition: all 0.3s ease; z-index: 2100; }

        /* --- Hover Popup --- */
        #hover-popup { position: fixed; pointer-events: none; z-index: 1000; display: none; opacity: 0; transform: scale(0.8); transition: opacity 0.3s ease, transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); max-width: 400px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); border-radius: 1rem; border: 4px solid white; overflow: hidden; background: white; }
        #hover-popup img { width: 100%; height: auto; display: block; }
        #hover-popup.active { display: block; opacity: 1; transform: scale(1); }

        /* --- Footer Styles (From About) --- */
        .social-icon { transition: all 0.5s cubic-bezier(0.23, 1, 0.32, 1); display: inline-block; }
        .social-icon:hover { transform: translateY(-5px); color: var(--brand); }
        .custom-button { transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); box-shadow: 0 10px 30px -10px rgba(22, 27, 145, 0.3); }
        .custom-button:hover { transform: translateY(-5px); scale: 1.02; }

        @media (max-width: 768px) {
            .work-item.video-item { grid-column: span 2; }
        }
    </style>
</head>

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        AOS.init({ duration: 800, once: true });

        const btns = document.querySelectorAll('.filter-btn');
        const items = document.querySelectorAll('.work-item');

        btns.forEach(btn => {
            btn.onclick = () => {
                btns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                const filter = btn.getAttribute('data-filter');
                items.forEach(item => {
                    if (item.getAttribute('data-category') === filter) {
                        item.classList.remove('hidden');
                    } else {
                        item.classList.add('hidden');
                    }
                });
            };
        });

        window.addEventListener('load', () => {
            document.querySelector('.filter-btn.active').click();
        });

        function openVideo(id, isShort = false) {
            const modalBox = document.getElementById('modal-box');
            if(isShort) {
                modalBox.classList.add('short-modal');
            } else {
                modalBox.classList.remove('short-modal');
            }
            document.getElementById('youtube-iframe').src = `https://www.youtube.com/embed/${id}?autoplay=1`;
            document.getElementById('video-modal').classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeVideo() {
            document.getElementById('youtube-iframe').src = '';
            document.getElementById('video-modal').classList.remove('active');
            document.body.style.overflow = 'auto';
        }

        const popup = document.getElementById('hover-popup');
        const popupImg = document.getElementById('popup-img');
        
        function showPopup(src) {
            if (window.innerWidth > 768) { // للكمبيوتر فقط
                popupImg.src = src;
                popup.classList.add('active');
            }
        }
        
        function hidePopup() {
            popup.classList.remove('active');
        }
        
        function movePopup(e) {
            const x = e.clientX + 20;
            const y = e.clientY + 20;
            popup.style.left = x + 'px';
            popup.style.top = y + 'px';
        }
    </script>
